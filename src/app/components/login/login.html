<div style="padding: 20px; max-width: 400px; margin: auto;">
  <h2>Register</h2>

  <!-- vartotojas raso, input atsinaujina -->

  <input [(ngModel)]="username" placeholder="Username" /><br><br>
  <input [(ngModel)]="password" type="password" placeholder="Password" /><br><br>
  <input [(ngModel)]="email" placeholder="Email" /><br><br>
  <input [(ngModel)]="phoneNumber" placeholder="Phone number" /><br><br>

  <button (click)="register()">Register</button>
  <button (click)="goToUsers()">Go to Users</button>

    <!-- interpolation, rodo message kintamojo reiksme, kai pasikeicia, automatiskai atsinaujina ekrane -->
  <p>{{ message }}</p> 
</div>
