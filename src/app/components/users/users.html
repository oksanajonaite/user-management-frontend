<div style="padding: 20px; max-width: 600px; margin: auto;">
  <h2>Users</h2>

  <input [(ngModel)]="username" placeholder="Username" /><br><br>
  <input [(ngModel)]="password" type="password" placeholder="Password" /><br><br>

  <button (click)="getUsers()">Get Users</button>
  <button (click)="goToAdmin()">Admin Panel</button>
  <button (click)="goToAudit()">Audit Log</button>

  <p>{{ message }}</p>

  @if (users.length > 0) {
  <table style="width:100%; margin-top:10px; border-collapse: collapse;">
  <tr>
    <th style="border: 1px solid black; padding: 8px;">ID</th>
    <th style="border: 1px solid black; padding: 8px;">Username</th>
    <th style="border: 1px solid black; padding: 8px;">Role</th>
    <th style="border: 1px solid black; padding: 8px;">Email</th>
    <th style="border: 1px solid black; padding: 8px;">Phone</th>
  </tr>
  @for (user of users; track user.id) {
    <tr>
      <td style="border: 1px solid black; padding: 8px;">{{ user.id }}</td>
      <td style="border: 1px solid black; padding: 8px;">{{ user.username }}</td>
      <td style="border: 1px solid black; padding: 8px;">{{ user.role }}</td>
      <td style="border: 1px solid black; padding: 8px;">{{ user.email }}</td>
      <td style="border: 1px solid black; padding: 8px;">{{ user.phoneNumber }}</td>
    </tr>
      }
    </table>
  }
</div>
